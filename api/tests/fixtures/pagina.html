<h1>Receita de pão caseiro</h1>
<p>Misture farinha, água, sal e fermento. Sove a massa por dez minutos até ficar lisa e elástica.</p>
<p>Deixe a massa descansar por uma hora em local morno. Depois asse em forno a duzentos graus por quarenta minutos.</p>
