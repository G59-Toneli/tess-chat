# /etc/nginx/conf.d/tess-chat-zones.conf. limit_req_zone só vale no contexto http,
# e o conf.d do Ubuntu é incluído dentro de http. O site tess-chat usa estas zonas.
# Chave por IP do cliente: o DNS aponta direto para o VPS, sem proxy na frente.
limit_req_zone $binary_remote_addr zone=tess_auth:10m rate=5r/m;
# Chat: só o POST do turno gasta Crédito. Chave vazia não conta, então o GET de compactação passa livre.
map $request_method $tess_chat_chave {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $tess_chat_chave zone=tess_chat:10m rate=20r/m;
