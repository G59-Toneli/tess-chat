# Produção no VPS compartilhado (ADR 0014). Só app + postgres; o nginx do host faz TLS.
# Sempre rode com -f deploy/docker-compose.yml: o compose da raiz é de dev e publica portas.
name: tess-chat

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Só POSTGRES_*: o .env da raiz tem chaves que o banco não usa. ${} lê o .env da raiz porque
    # o deploy.sh passa --env-file .env. Sem ele, a senha fica vazia, o que só pesa num volume novo.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: tess_owner
      POSTGRES_DB: tess
    # Sem ports: o banco só é visto pela rede interna do compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tess_owner -d tess"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Roda as migrações e sai. O app só sobe depois, porque o seed da conta demo precisa das tabelas.
  migrate:
    build: ..
    image: tess-chat-app:latest
    env_file: ../.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: ..
    image: tess-chat-app:latest
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      # Anexos ficam em /app/data/attachments (config.attachments_dir).
      - appdata:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  appdata:
