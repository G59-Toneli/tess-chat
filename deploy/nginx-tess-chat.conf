# /etc/nginx/sites-available/tess-chat (symlink em sites-enabled). O certbot acrescenta o bloco 443.
server {
    listen 80;
    server_name chat.toneli.dev.br;

    # Anexo vai até 20 MB (api/app/anexos.py). Margem para o multipart.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE do chat: sem buffer e sem cortar stream longo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
    }
}
