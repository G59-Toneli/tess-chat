# /etc/nginx/sites-available/tess-chat (symlink em sites-enabled). O certbot acrescenta o bloco 443.
# Exige as zonas de deploy/nginx-tess-chat-zones.conf em /etc/nginx/conf.d/ (contexto http).
server {
    listen 80;
    server_name chat.toneli.dev.br;

    # Anexo vai até 20 MB (api/app/anexos.py). Margem para o multipart.
    client_max_body_size 25M;

    # Headers no server, nunca em location: add_header numa location descarta os herdados.
    # HSTS só vale na resposta https; o certbot põe este bloco no 443. Sem CSP (docs/LACUNAS.md).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Herdados por todas as locations abaixo.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE do chat: sem buffer e sem cortar stream longo.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600;

    limit_req_status 429;

    # Login e cadastro: força bruta de senha e criação de conta em massa.
    location /auth/ {
        limit_req zone=tess_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
    }

    # Turno do chat: cada request gasta Crédito no modelo.
    location /api/chat/ {
        limit_req zone=tess_chat burst=10 nodelay;
        proxy_pass http://127.0.0.1:8010;
    }

    # Ligação (WebSocket). proxy_set_header numa location descarta os herdados: repete todos.
    # Upgrade/Connection deixam o handshake passar; read_timeout acima do teto da chamada (540 s).
    location /api/voz/ws {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
    }
}
