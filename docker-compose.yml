# Postgres local de desenvolvimento. Porta 5433 para não colidir com outro Postgres.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tess_owner
      POSTGRES_PASSWORD: tess_owner
      POSTGRES_DB: tess
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tess_owner -d tess"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
