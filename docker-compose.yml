# Postgres local de desenvolvimento. Porta 5433 para não colidir com outro Postgres.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tess_owner
      POSTGRES_PASSWORD: tess_owner
      POSTGRES_DB: tess
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tess_owner -d tess"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Servidor MCP mínimo, plano B do ticket 17. MCP_DEMO_TOKEN vazio = sem autenticação.
  mcp-demo:
    build: ./deploy/mcp-demo
    environment:
      MCP_DEMO_TOKEN: ${MCP_DEMO_TOKEN:-}
    ports:
      - "8765:8765"

volumes:
  pgdata:
